<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <rect width="700" height="440" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Known-floor capacity per contributing account</text>
  <text x="350" y="50" text-anchor="middle" font-size="12" fill="#57606a">tokens/hour a single free-tier account is credited with the moment it joins</text>

  <!-- baseline -->
  <line x1="80" y1="378" x2="620" y2="378" stroke="#d0d7de" stroke-width="2"/>

  <!-- Ollama bar (sqrt-scaled height for legibility; exact values are labeled) -->
  <rect x="150" y="88" width="140" height="290" rx="6" fill="#2563eb"/>
  <text x="220" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">300,000 / hr</text>
  <text x="220" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Ollama Cloud</text>
  <text x="220" y="417" text-anchor="middle" font-size="11" fill="#16a34a">&#9679; directly measured</text>

  <!-- Google bar -->
  <rect x="410" y="326" width="140" height="52" rx="6" fill="#ea580c"/>
  <text x="480" y="313" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">9,000 / hr</text>
  <text x="480" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Google AI Studio</text>
  <text x="480" y="417" text-anchor="middle" font-size="11" fill="#b45309">&#9679; conservative estimate</text>

  <text x="350" y="434" text-anchor="middle" font-size="10.5" fill="#8b949e">Bar heights use a compressed (square-root) scale for legibility - exact figures are labeled above each bar. Both floors are additive per account: hold both credentials and both apply.</text>
</svg>
