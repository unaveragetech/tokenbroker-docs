<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Which worker gets the job?</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#57606a">the gateway checks these, in order, and stops at the first match</text>

  <!-- tier 1 -->
  <rect x="60" y="75" width="640" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="100" font-size="14" font-weight="700" fill="#14532d">1 &#183; Already ready</text>
  <text x="90" y="120" font-size="12" fill="#166534">a node already has the model - including a node with a matching external-provider key (Google AI Studio, ...)</text>

  <!-- tier 2 -->
  <rect x="60" y="147" width="640" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="172" font-size="14" font-weight="700" fill="#1e3a8a">2 &#183; Ollama Cloud</text>
  <text x="90" y="192" font-size="12" fill="#1e40af">a cloud-tagged model and the node's Ollama Cloud quota has room - near-instant, no download</text>

  <!-- tier 3 -->
  <rect x="60" y="219" width="640" height="62" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="90" y="244" font-size="14" font-weight="700" fill="#78350f">3 &#183; Pull on demand</text>
  <text x="90" y="264" font-size="12" fill="#92400e">a pullable model that fits the node's storage budget - the worker downloads it, then runs the job</text>

  <text x="380" y="315" text-anchor="middle" font-size="11.5" fill="#8b949e">A node never receives a job it can't actually run - RAM, VRAM, and storage are all checked first.</text>
</svg>
