<svg viewBox="0 0 980 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="980" height="260" fill="#ffffff"/>
  <text x="490" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Life of one job, start to credit</text>

  <!-- steps -->
  <!-- 1 -->
  <rect x="20" y="70" width="150" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="95" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">1. Created</text>
  <text x="95" y="118" text-anchor="middle" font-size="11" fill="#166534">requester's wallet</text>
  <text x="95" y="133" text-anchor="middle" font-size="11" fill="#166534">is billed up front</text>

  <line x1="170" y1="110" x2="208" y2="110" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 -->
  <rect x="210" y="70" width="150" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2. Queued</text>
  <text x="285" y="118" text-anchor="middle" font-size="11" fill="#1e40af">waits for a capable</text>
  <text x="285" y="133" text-anchor="middle" font-size="11" fill="#1e40af">worker to ask for work</text>

  <line x1="360" y1="110" x2="398" y2="110" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 -->
  <rect x="400" y="70" width="160" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">3. Claimed &amp; run</text>
  <text x="480" y="118" text-anchor="middle" font-size="11" fill="#92400e">local model, Ollama Cloud,</text>
  <text x="480" y="133" text-anchor="middle" font-size="11" fill="#92400e">or an external provider key</text>

  <line x1="560" y1="110" x2="598" y2="110" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect x="600" y="70" width="160" height="80" rx="10" fill="#fde8ef" stroke="#be185d" stroke-width="2"/>
  <text x="680" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">4. Quality gate</text>
  <text x="680" y="114" text-anchor="middle" font-size="11" fill="#9d174d">length, speed, diversity</text>
  <text x="680" y="129" text-anchor="middle" font-size="11" fill="#9d174d">checked before any credit</text>
  <text x="680" y="144" text-anchor="middle" font-size="10.5" fill="#9d174d" font-style="italic">fails here = no payout</text>

  <line x1="760" y1="110" x2="798" y2="110" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 -->
  <rect x="800" y="70" width="160" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="880" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">5. Accepted &amp;</text>
  <text x="880" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">credited</text>
  <text x="880" y="134" text-anchor="middle" font-size="11" fill="#5b21b6">worker's account earns</text>
  <text x="880" y="148" text-anchor="middle" font-size="11" fill="#5b21b6">tiered, idempotent credit</text>

  <text x="490" y="220" text-anchor="middle" font-size="11.5" fill="#57606a">Every job requester is billed once, up front - the queue can never be used to mint credits for free.</text>
  <text x="490" y="238" text-anchor="middle" font-size="11.5" fill="#57606a">Every worker payout happens once, only after a real, quality-checked response - never before.</text>
</svg>
